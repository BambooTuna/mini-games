<!DOCTYPE html>
<html><body><pre id="out">testing...</pre>
<script type="module">
// 効果音デコード検証用の一時ページ(検証後に削除)
const COUNTS = { hit: 5, kill: 5, chop: 5, shatter: 5, pickup: 5, sell: 3, money: 6 };
const ctx = new AudioContext();
const lines = [];
for (const [name, count] of Object.entries(COUNTS)) {
  for (let i = 0; i < count; i++) {
    const f = `assets/sfx/${name}_${i}.m4a`;
    try {
      const res = await fetch(f);
      if (!res.ok) throw new Error(res.status);
      const buf = await ctx.decodeAudioData(await res.arrayBuffer());
      lines.push(`OK ${f} ${buf.duration.toFixed(2)}s`);
    } catch (e) {
      lines.push(`FAIL ${f} ${e}`);
    }
  }
}
document.getElementById("out").textContent = lines.join("\n") + "\nDONE";
</script></body></html>
