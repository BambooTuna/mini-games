    <!-- オノ(体の後ろ) -->
    <line x1="46" y1="30" x2="58" y2="48" stroke="#7a4a22" stroke-width="4"/>
    <path d="M52 38 L63 44 L54 53 Q49 46 52 38 Z" fill="#b8c4cd" stroke="#5a6b78"/>
    <!-- 体(パーカー) -->
    <path d="M18 36 Q18 26 32 26 Q46 26 46 36 L46 52 Q46 58 40 58 L24 58 Q18 58 18 52 Z" fill="#3b6ea5"/>
