    <circle cx="32" cy="16" r="13" fill="#3b6ea5"/>
    <circle cx="32" cy="16" r="10" fill="#e8d9c4" stroke="#c4b298"/>
    <!-- 顔 -->
    <circle cx="32" cy="17" r="8" fill="#ffd9b3" stroke="none"/>
    <circle cx="29" cy="16" r="1.4" fill="#27364a" stroke="none"/>
    <circle cx="35" cy="16" r="1.4" fill="#27364a" stroke="none"/>
    <path d="M30 20 Q32 22 34 20" fill="none" stroke="#27364a" stroke-width="1.5"/>
    <!-- ほっぺ -->
    <circle cx="26.5" cy="19" r="1.6" fill="#f2a896" stroke="none"/>
    <circle cx="37.5" cy="19" r="1.6" fill="#f2a896" stroke="none"/>
  </g>
</svg>
